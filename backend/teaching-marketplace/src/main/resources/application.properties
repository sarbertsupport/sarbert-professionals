spring.application.name=teaching-marketplace

server.port=8089

# --- Persistence: R2DBC + PostgreSQL only (no JPA/Hibernate in this app) ---
spring.r2dbc.url=${DATASOURCE_URL}
spring.r2dbc.username=${DATASOURCE_USER}
spring.r2dbc.password=${DATASOURCE_PASSWORD}

# Connection pool (tuned for chat-heavy workloads)
spring.r2dbc.pool.initial-size=15
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=60m
spring.r2dbc.pool.max-life-time=60m
spring.r2dbc.pool.validation-query=SELECT 1
spring.r2dbc.pool.test-while-idle=true
spring.r2dbc.pool.time-between-eviction-runs=30000
spring.r2dbc.pool.min-evictable-idle-time=60000

# Script init for R2DBC + PostgreSQL (Spring Boot 3 uses spring.sql.init.* for the shared initializer)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Keep R2DBC-specific overrides aligned (some versions still bind these)
spring.r2dbc.sql.init.mode=always
spring.r2dbc.sql.init.schema-locations=classpath:schema.sql
spring.r2dbc.properties.force-binary=true

# Profiles: use --spring.profiles.active=dev locally for verbose logs; prod for production defaults
# (see application-dev.properties / application-prod.properties)

# Mail
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.verification.host=${ACCOUNT_VERIFICATION_URL}
spring.reset.host=${ACCOUNT_RESET_URL}
spring.frontend.url=${FRONT_END_URL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Support desk SLAs (hours from ticket creation)
support.sla.first-response-hours=24
support.sla.resolution-hours=168
# Public ticket reference: PREFIX + zero-padded sequence (e.g. INCC000000001)
support.ticket.prefix=INCC
support.ticket.number-width=9

# Cloudinary
app.ms.cloudName=${CLOUDINARY_CLOUD_NAME}
app.ms.apiKey=${CLOUDINARY_API_KEY}
app.ms.apiSecret=${CLOUDINARY_API_SECRET}
app.ms.folderName=TeacherPt
app.ms.maxFileSize=245760
app.ms.maxNumberOfSubjects=5

# Paystack
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.public.key=${PAYSTACK_PUBLIC_KEY}
paystack.webhook.secret=${PAYSTACK_WEBHOOK_SECRET}
paystack.callback.url=${PAYSTACK_CALLBACK_URL}
paystack.timeout.seconds=30

# M-PESA
mpesa.consumer-key=${MPESA_CONSUMER_KEY}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET}
mpesa.business-short-code=${MPESA_BUSINESS_SHORT_CODE}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.stk-push-url=https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest
mpesa.stk-push-query-url=https://sandbox.safaricom.co.ke/mpesa/stkpushquery/v2/query
mpesa.stk-query-min-age-seconds=60
mpesa.oauth-url=https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials
# Daraja sandbox paybill (e.g. 174379) expects CustomerPayBillOnline. Buy-goods / till numbers use CustomerBuyGoodsOnline.
mpesa.transaction-type=${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
#mpesa.callback-url=https://skillbridge-website.onrender.com/api/v1/payments/m/callback
mpesa.callback-url=https://d74f-105-163-158-108.ngrok-free.app/api/v1/payments/m/callback

# Actuator (endpoints aligned with SecurityConfig permit list)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Production-safe logging defaults (verbose: add --spring.profiles.active=dev)
logging.level.root=INFO
logging.level.com.albert.microservices.teaching.marketplace=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
