# Production: activate with --spring.profiles.active=prod
logging.level.root=WARN
logging.level.com.albert.microservices.teaching.marketplace=INFO

# Schema is owned by Flyway (classpath:db/migration) — do not re-enable schema.sql init
spring.sql.init.mode=never
spring.r2dbc.sql.init.mode=never
spring.flyway.enabled=true
