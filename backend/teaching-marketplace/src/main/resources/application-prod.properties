# Production: activate with --spring.profiles.active=prod
logging.level.root=WARN
logging.level.com.albert.microservices.teaching.marketplace=INFO

# Ensure schema.sql (support_tickets, sequences, etc.) runs on PostgreSQL.
# Override with spring.sql.init.mode=never only if you apply DDL outside the app (e.g. Flyway).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.r2dbc.sql.init.mode=always
spring.r2dbc.sql.init.schema-locations=classpath:schema.sql
